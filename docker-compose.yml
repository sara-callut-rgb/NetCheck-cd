services:
  db:
    image: postgres:15
    container_name: NetCheck-DB
    restart: always
    environment:
      POSTGRES_USER: netcheck_user
      POSTGRES_PASSWORD: netcheck_password
      POSTGRES_DB: NetCheck-DB

    ports:
      - "5432:5432"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - NetChecks_Database:/var/lib/postgresql/data

volumes:
  NetChecks_Database:
  